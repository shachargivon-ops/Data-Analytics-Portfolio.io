<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">NFL relational database: schema from SQL definitions</title><desc id="desc">Players, Teams and Seasons are referenced by PassingStats. SackStats references PassingStats. Foreign keys are nullable and SackStats uniqueness is not enforced.</desc><rect width="1200" height="675" fill="#f1f5f6"/><g font-family="Arial,sans-serif"><text x="70" y="75" font-size="19" letter-spacing="3" fill="#087b79">NFL ANALYSIS / RELATIONAL MODEL</text><text x="70" y="144" font-size="44" fill="#122d40">Identities. Seasons. Performance.</text><text x="70" y="186" font-size="20" fill="#536675">Diagram derived from the SQL definitions · not a database screenshot</text><g stroke="#087b79" stroke-width="3" fill="none"><path d="M247 300 V331 H600 V368"/><path d="M600 300 V368"/><path d="M953 300 V331 H600"/><path d="M750 423 H857"/></g><g fill="white" stroke="#b9cbd3" stroke-width="2"><rect x="85" y="232" width="324" height="70" rx="4"/><rect x="438" y="232" width="324" height="70" rx="4"/><rect x="791" y="232" width="324" height="70" rx="4"/><rect x="365" y="368" width="390" height="145" rx="4"/><rect x="857" y="382" width="258" height="112" rx="4"/></g><g font-size="26" fill="#122d40"><text x="110" y="277">Players</text><text x="463" y="277">Teams</text><text x="816" y="277">Seasons</text><text x="391" y="407">PassingStats</text><text x="881" y="422">SackStats</text></g><g font-size="18" fill="#536675"><text x="391" y="447">FK: PlayerID, TeamID, SeasonID</text><text x="391" y="480">Passing metrics by observation</text><text x="881" y="460">FK: PassingStatID</text></g><g fill="#087b79" font-size="18"><text x="779" y="410">1 → *</text><text x="644" y="347">1 → *</text></g><text x="70" y="571" font-size="19" fill="#536675">Five tables · Primary/foreign keys · INSERT … SELECT loading queries</text><text x="70" y="615" font-size="18" fill="#536675">Foreign keys are nullable; one-to-one SackStats uniqueness is not enforced.</text></g></svg>
