<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">WideWorldImporters: order-gap SQL analysis</title><desc id="desc">Source-derived illustration of customer orders, LAG-based order gaps, average gaps and a rule-based potential inactivity flag. No executed results are shown.</desc><rect width="1200" height="675" fill="#122d40"/><g font-family="Arial,sans-serif"><text x="70" y="75" font-size="19" letter-spacing="3" fill="#93cfc9">WIDEWORLDIMPORTERS / EXERCISE 09</text><text x="70" y="147" font-size="36" fill="white">When does an order gap warrant a closer look?</text><text x="70" y="190" font-size="21" fill="#b9cbd3">A source-derived SQL workflow · not an executed business result</text><g fill="#1d4156" stroke="#537888"><rect x="70" y="237" width="320" height="104" rx="5"/><rect x="440" y="237" width="320" height="104" rx="5"/><rect x="810" y="237" width="320" height="104" rx="5"/></g><g fill="white" font-size="25"><text x="96" y="280">CustomerOrders</text><text x="466" y="280">OrderGaps</text><text x="836" y="280">CustomerAVG</text></g><g fill="#b9cbd3" font-size="18"><text x="96" y="311">LAG(OrderDate) by customer</text><text x="466" y="311">DATEDIFF between orders</text><text x="836" y="311">AVG(gap) + latest order</text></g><g fill="#93cfc9" font-size="30"><text x="405" y="300">→</text><text x="775" y="300">→</text></g><rect x="70" y="376" width="1060" height="207" fill="#0d2231" rx="5"/><g font-family="Consolas,monospace" font-size="25"><text x="100" y="421" fill="#93cfc9">CASE</text><text x="125" y="462" fill="#e5eef2">WHEN DATEDIFF(DAY, LastCustOrderDate, LastOrder)</text><text x="152" y="503" fill="#e5eef2">&gt; AvgDaysBetweenOrders * 2 THEN 'Potential Churn'</text><text x="125" y="544" fill="#e5eef2">ELSE 'Active' END</text></g><text x="70" y="623" font-size="18" fill="#b9cbd3">Measured relative to the dataset’s latest order · source and limitations linked in the case study</text></g></svg>
